[package]
name = "yt-gui"
version = "0.1.0"
description = "GUI leve para o yt-dlp"
authors = ["Vini"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows (cargo#8519)
name = "yt_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
